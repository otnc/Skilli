name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'patch / minor / major / prerelease または明示バージョン'
        type: string
        required: true
        default: patch
      preid:
        description: 'プレリリース識別子（rc、beta など）'
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - id: version
        env:
          VERSION: ${{ inputs.version }}
          PREID: ${{ inputs.preid }}
        shell: bash
        run: bash scripts/release/next-version.sh >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.retry == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git switch --detach "refs/tags/$env:TAG"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: ./scripts/check-format.ps1
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      - run: ./scripts/release/install-inno.ps1
      - env:
          TAG: ${{ steps.version.outputs.tag }}
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: ./scripts/release/build.ps1 -Version ($env:TAG.Substring(1))
      - env:
          TAG: ${{ steps.version.outputs.tag }}
          RETRY: ${{ steps.version.outputs.retry }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/release/publish.sh
